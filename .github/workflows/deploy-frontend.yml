name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "us-east-1"
    secrets:
      aws-role-arn:
        required: true
      bucket-name:
        required: true
      cloudfront-id:
        required: true
      vite-env:
        required: true
        description: "Multiline VITE_* env vars as a single secret"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Write env file
        run: echo "${{ secrets.vite-env }}" > .env
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to S3
        run: |
          # Long-cache for hashed assets
          aws s3 sync dist/ s3://${{ secrets.bucket-name }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "manifest.webmanifest" \
            --exclude "sw.js"

          # Short-cache for entry points
          aws s3 cp dist/index.html s3://${{ secrets.bucket-name }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"
          aws s3 cp dist/manifest.webmanifest s3://${{ secrets.bucket-name }}/manifest.webmanifest \
            --cache-control "public,max-age=0,must-revalidate" || true
          aws s3 cp dist/sw.js s3://${{ secrets.bucket-name }}/sw.js \
            --cache-control "public,max-age=0,must-revalidate" || true

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront-id }} \
            --paths "/index.html" "/manifest.webmanifest" "/sw.js"
