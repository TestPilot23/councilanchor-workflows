name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "us-east-1"
      s3-artifact-bucket:
        required: false
        type: string
        default: ""
        description: "Fallback for GitHub's Actions storage quota (see project_councilanchor_gh_actions_storage_quota memory): when set, Build/Deploy hand the dist/ folder off via this S3 bucket instead of actions/upload-artifact + actions/download-artifact. Omit for GitHub-native artifacts (the default)."
    secrets:
      aws-role-arn:
        required: true
      bucket-name:
        required: true
      cloudfront-id:
        required: true
      vite-env:
        required: true
        description: "Multiline VITE_* env vars as a single secret"
      s3-artifact-role-arn:
        required: false
        description: "OIDC role scoped to just s3-artifact-bucket. Required when that input is set"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Write env file
        run: echo "${{ secrets.vite-env }}" > .env
      - name: Build
        run: npm run build

      # S3 fallback path (see the s3-artifact-bucket input's description). A separate,
      # narrowly-scoped role: unlike Deploy, this job runs on pull_request too — the
      # role below can only PutObject to this one bucket, not the broad deploy role's reach.
      - name: Configure AWS credentials for S3 artifact hand-off
        if: inputs.s3-artifact-bucket != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.s3-artifact-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Upload build artifact to S3
        if: inputs.s3-artifact-bucket != ''
        run: aws s3 sync dist/ "s3://${{ inputs.s3-artifact-bucket }}/frontend/${{ github.sha }}/dist/" --delete

      - uses: actions/upload-artifact@v7
        if: inputs.s3-artifact-bucket == ''
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          # The build->deploy hop within one run is all this artifact needs to survive; a short
          # retention keeps the org's shared Actions artifact storage quota from filling with builds
          # nothing downloads again. See councilAnchor project_councilanchor_gh_actions_storage_quota memory.
          retention-days: 1

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials for S3 artifact hand-off
        if: inputs.s3-artifact-bucket != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.s3-artifact-role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Download build artifact from S3
        if: inputs.s3-artifact-bucket != ''
        run: |
          mkdir -p dist
          aws s3 sync "s3://${{ inputs.s3-artifact-bucket }}/frontend/${{ github.sha }}/dist/" dist/

      - uses: actions/download-artifact@v8
        if: inputs.s3-artifact-bucket == ''
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync to S3
        run: |
          # Long-cache for hashed assets
          aws s3 sync dist/ s3://${{ secrets.bucket-name }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "manifest.webmanifest" \
            --exclude "sw.js"

          # Short-cache for entry points
          aws s3 cp dist/index.html s3://${{ secrets.bucket-name }}/index.html \
            --cache-control "public,max-age=0,must-revalidate"
          aws s3 cp dist/manifest.webmanifest s3://${{ secrets.bucket-name }}/manifest.webmanifest \
            --cache-control "public,max-age=0,must-revalidate" || true
          aws s3 cp dist/sw.js s3://${{ secrets.bucket-name }}/sw.js \
            --cache-control "public,max-age=0,must-revalidate" || true

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.cloudfront-id }} \
            --paths "/index.html" "/manifest.webmanifest" "/sw.js"
