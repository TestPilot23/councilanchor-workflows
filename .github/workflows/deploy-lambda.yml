name: Deploy Lambda Service

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
        description: "e.g. council, member"
      environment:
        required: true
        type: string
        description: "dev or prod"
      aws-region:
        required: false
        type: string
        default: "us-east-1"
      extra-env-vars:
        required: false
        type: string
        default: ""
        description: "Comma-separated KEY=VALUE pairs appended to the Lambda environment"
    secrets:
      aws-role-arn:
        required: true
      shared-go-deploy-key:
        required: false
        description: "Read-only SSH deploy key for councilanchor-shared-go, for services that import it"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Configure shared-go module access
        if: secrets.shared-go-deploy-key != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.shared-go-deploy-key }}
      - name: Set GOPRIVATE for shared-go
        if: secrets.shared-go-deploy-key != ''
        run: |
          go env -w GOPRIVATE=github.com/TestPilot23/councilanchor-shared-go
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: Run tests
        run: go test ./internal/... -race

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Configure shared-go module access
        if: secrets.shared-go-deploy-key != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.shared-go-deploy-key }}
      - name: Set GOPRIVATE for shared-go
        if: secrets.shared-go-deploy-key != ''
        run: |
          go env -w GOPRIVATE=github.com/TestPilot23/councilanchor-shared-go
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: Build Lambda binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          go build -tags lambda.norpc -ldflags="-s -w" -o bootstrap ./cmd/lambda
          zip -j function.zip bootstrap
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ inputs.service-name }}-${{ github.sha }}
          path: function.zip
          retention-days: 7

  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: deploy-${{ inputs.service-name }}-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-${{ inputs.service-name }}-${{ github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy Lambda (create or update)
        env:
          FUNCTION_NAME: councilanchor-${{ inputs.service-name }}-${{ inputs.environment }}
          REGION: ${{ inputs.aws-region }}
          ENV: ${{ inputs.environment }}
          EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_URL="https://councilanchor.com"
          [ "$ENV" = "dev" ] && APP_URL="https://dev.councilanchor.com"
          SCHEDULER_ROLE_ARN=$(aws iam get-role \
            --role-name "councilanchor-scheduler-exec-$ENV" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          SCRAPER_FN_ARN="arn:aws:lambda:$REGION:$ACCOUNT_ID:function:councilanchor-member-scraper-$ENV"
          LAMBDA_VARS="DYNAMODB_TABLE=councilanchor-$ENV,\
            MEMBERS_TABLE=councilanchor-$ENV-members,\
            COUNCILS_TABLE=councilanchor-$ENV-councils,\
            CONFLICTS_TABLE=councilanchor-$ENV-conflicts,\
            SNAPSHOTS_TABLE=councilanchor-$ENV-snapshots,\
            AUTH_TABLE=councilanchor-$ENV-auth,\
            IMPORT_JOBS_TABLE=councilanchor-$ENV-import-jobs,\
            GEOCODING_JOBS_TABLE=councilanchor-$ENV-geocoding-jobs,\
            OFFICER_TERMS_TABLE=councilanchor-$ENV-officer-terms,\
            IMPORT_BUCKET=councilanchor-imports-$ENV,\
            IMPORT_QUEUE_URL=https://sqs.$REGION.amazonaws.com/$ACCOUNT_ID/councilanchor-import-work-$ENV,\
            WORKER_FUNCTION_NAME=councilanchor-member-worker-$ENV,\
            ENVIRONMENT=$ENV,\
            APP_URL=$APP_URL,\
            SCHEDULER_ROLE_ARN=$SCHEDULER_ROLE_ARN,\
            SCRAPER_FUNCTION_ARN=$SCRAPER_FN_ARN,\
            AUTO_IMPORT_INTERVAL_DAYS=90"
          if [ -n "${{ inputs.extra-env-vars }}" ]; then
            LAMBDA_VARS="$LAMBDA_VARS,${{ inputs.extra-env-vars }}"
          fi
          if aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" 2>/dev/null; then
            echo "Function exists — updating code"
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip \
              --architectures arm64 \
              --region "$REGION"
          else
            echo "Function does not exist — creating"
            ROLE_ARN=$(aws iam get-role \
              --role-name "councilanchor-lambda-exec-$ENV" \
              --query 'Role.Arn' --output text)
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime provided.al2023 \
              --architectures arm64 \
              --role "$ROLE_ARN" \
              --handler bootstrap \
              --zip-file fileb://function.zip \
              --environment "Variables={$LAMBDA_VARS}" \
              --timeout 30 \
              --memory-size 128 \
              --tracing-config Mode=Active \
              --region "$REGION"
          fi

      - name: Wait for update
        env:
          FUNCTION_NAME: councilanchor-${{ inputs.service-name }}-${{ inputs.environment }}
          REGION: ${{ inputs.aws-region }}
        run: |
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$REGION"

      - name: Update function configuration
        env:
          FUNCTION_NAME: councilanchor-${{ inputs.service-name }}-${{ inputs.environment }}
          REGION: ${{ inputs.aws-region }}
          ENV: ${{ inputs.environment }}
          EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_URL="https://councilanchor.com"
          [ "$ENV" = "dev" ] && APP_URL="https://dev.councilanchor.com"
          SCHEDULER_ROLE_ARN=$(aws iam get-role \
            --role-name "councilanchor-scheduler-exec-$ENV" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          SCRAPER_FN_ARN="arn:aws:lambda:$REGION:$ACCOUNT_ID:function:councilanchor-member-scraper-$ENV"
          LAMBDA_VARS="DYNAMODB_TABLE=councilanchor-$ENV,\
            MEMBERS_TABLE=councilanchor-$ENV-members,\
            COUNCILS_TABLE=councilanchor-$ENV-councils,\
            CONFLICTS_TABLE=councilanchor-$ENV-conflicts,\
            SNAPSHOTS_TABLE=councilanchor-$ENV-snapshots,\
            AUTH_TABLE=councilanchor-$ENV-auth,\
            IMPORT_JOBS_TABLE=councilanchor-$ENV-import-jobs,\
            OFFICER_TERMS_TABLE=councilanchor-$ENV-officer-terms,\
            IMPORT_BUCKET=councilanchor-imports-$ENV,\
            IMPORT_QUEUE_URL=https://sqs.$REGION.amazonaws.com/$ACCOUNT_ID/councilanchor-import-work-$ENV,\
            WORKER_FUNCTION_NAME=councilanchor-member-worker-$ENV,\
            ENVIRONMENT=$ENV,\
            APP_URL=$APP_URL,\
            SCHEDULER_ROLE_ARN=$SCHEDULER_ROLE_ARN,\
            SCRAPER_FUNCTION_ARN=$SCRAPER_FN_ARN,\
            AUTO_IMPORT_INTERVAL_DAYS=90"
          if [ -n "$EXTRA_ENV_VARS" ]; then
            LAMBDA_VARS="$LAMBDA_VARS,$EXTRA_ENV_VARS"
          fi
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "Variables={$LAMBDA_VARS}" \
            --region "$REGION"
          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME" \
            --region "$REGION"

      - name: Grant API Gateway invoke permission
        env:
          FUNCTION_NAME: councilanchor-${{ inputs.service-name }}-${{ inputs.environment }}
          REGION: ${{ inputs.aws-region }}
          ENV: ${{ inputs.environment }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          API_ID=$(aws apigatewayv2 get-apis --region "$REGION" \
            --query "Items[?Name=='councilanchor-api-$ENV'].ApiId" --output text)
          if [ -n "$API_ID" ]; then
            SOURCE_ARN="arn:aws:execute-api:$REGION:$ACCOUNT_ID:$API_ID/*/*"
            aws lambda add-permission \
              --function-name "$FUNCTION_NAME" \
              --statement-id "AllowAPIGatewayInvoke" \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "$SOURCE_ARN" \
              --region "$REGION" 2>/dev/null || echo "Permission already exists — skipping"
          else
            echo "API Gateway not found — skipping permission grant"
          fi

  smoke-test:
    name: Smoke test (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Invoke health check
        run: |
          STATUS=$(aws lambda invoke \
            --function-name "councilanchor-${{ inputs.service-name }}-${{ inputs.environment }}" \
            --payload '{"rawPath":"/health","requestContext":{"http":{"method":"GET"}}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json \
            --query StatusCode \
            --output text)
          echo "Lambda status: $STATUS"
          cat /tmp/response.json
          [ "$STATUS" = "200" ] || exit 1
